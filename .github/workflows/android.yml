name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'tools/build-mobile.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Выложить APK в релиз'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: node tools/build-mobile.js

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Apply launcher icons
        run: |
          RES=mobile/android/app/src/main/res
          cp -r mobile/android-res/* "$RES"/
          rm -rf "$RES"/mipmap-anydpi-v26
          echo "icons in place:" && ls "$RES" | head

      - name: Sync web layer
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the artifact
        id: pack
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/LumenReader-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: LumenReader-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${{ steps.pack.outputs.version }}-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --title "Lumen Reader для Android ${{ steps.pack.outputs.version }}" \
            --notes "Собрано из коммита ${{ github.sha }}.

          Скачай APK, открой на телефоне и разреши установку из этого источника.
          В приложении: Ещё → Синхронизация → вставь GitHub-токен и логин." \
            --latest
